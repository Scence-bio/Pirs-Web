<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#46178f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="پرس" />
    <meta name="application-name" content="پرس" />
    <meta
      name="description"
      content="پرس — یاریی پرسیار. کویز، کۆد، تایمەر و لیدەربۆرد."
    />
    <title>پرس — یاریی پرسیار</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #46178f;
        color: #fff;
      }
      .boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      .boot::after {
        content: '';
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #ffc107;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-live="polite"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
